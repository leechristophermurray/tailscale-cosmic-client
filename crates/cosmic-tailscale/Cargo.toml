[package]
name = "cosmic-tailscale"
description = "Native Tailscale client for the COSMIC desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tailscale-localapi.workspace = true
caddy-admin.workspace = true
beszel-client.workspace = true
libcosmic = { workspace = true, features = ["winit", "tokio", "a11y", "dbus-config", "wayland", "x11", "multi-window", "desktop", "about", "wgpu", "xdg-portal"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
open.workspace = true
notify-rust.workspace = true
dirs.workspace = true
url.workspace = true
keyring.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true

[[bin]]
name = "cosmic-tailscale"
path = "src/main.rs"
