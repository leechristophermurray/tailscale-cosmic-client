version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to a git revision; moving it is a deliberate, tested change.
      - dependency-name: libcosmic
    groups:
      # Patch and minor updates arrive as one pull request; majors stand alone.
      cargo:
        update-types: [minor, patch]
