name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Unlike the implicit default, an explicit bash runs with -o pipefail.
defaults:
  run:
    shell: bash

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-versions.sh "$TAG"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write to the repository, and it runs no build.
    permissions:
      contents: write
    steps:
      # The tarball CI built and tested in this run, not a rebuild.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Checksum the .deb too
        working-directory: dist
        run: for deb in ./*.deb; do sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256"; done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # v1.2.0-rc.1 and the like are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---- distribution channels ---------------------------------------------------
  #
  # Each channel needs an account and a secret; see "Distribution channels" in
  # the README. Until its secret exists a job skips itself with a notice, so a
  # release never fails for want of one.

  apt:
    name: Apt repository
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check for the signing key
        id: enabled
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [[ -n "$APT_SIGNING_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::APT_SIGNING_KEY is not set, so the apt repository was not published."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.enabled.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Install apt-ftparchive
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apt-utils
      # The site is rebuilt whole on every release, from the .debs attached to
      # every published release, so older versions stay installable.
      - name: Collect every released .deb
        if: steps.enabled.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p debs
          gh release list --repo "$REPO" --limit 200 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release download "$tag" --repo "$REPO" --pattern '*.deb' --dir debs --skip-existing || true
            done
          ls -l debs
      - name: Build and sign the repository
        if: steps.enabled.outputs.enabled == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ./scripts/apt-repo.sh debs site "https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.enabled.outputs.enabled == 'true'
        with:
          path: site
      - id: deploy
        if: steps.enabled.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  copr:
    name: Fedora COPR
    needs: publish
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    # COPR builds from source and queues behind other projects.
    timeout-minutes: 120
    steps:
      - name: Check for COPR credentials
        id: enabled
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          # A repository variable is the natural home for a project name, but
          # it is easy to add as a secret instead; either works.
          COPR_PROJECT: ${{ vars.COPR_PROJECT || secrets.COPR_PROJECT }}
        run: |
          if [[ -n "$COPR_CONFIG" && -n "$COPR_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::COPR_CONFIG or COPR_PROJECT is not set, so no COPR build was started."
          fi
      - name: Install copr-cli
        if: steps.enabled.outputs.enabled == 'true'
        run: dnf install -y -q copr-cli
      # COPR clones the tag itself and runs .copr/Makefile, so the SRPM holds
      # exactly the tagged sources.
      - name: Build the tag in COPR
        if: steps.enabled.outputs.enabled == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || secrets.COPR_PROJECT }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          # copr-cli splits the project on "/", so a trailing slash would read
          # as an empty project name.
          copr-cli buildscm "${COPR_PROJECT%/}" --clone-url "$CLONE_URL" --commit "$TAG" \
            --method make_srpm --spec packaging/rpm/cosmic-tailscale.spec

  aur:
    name: AUR
    needs: publish
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Check for the AUR key
        id: enabled
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so nothing was published to the AUR."
          fi
      - name: Install tools
        if: steps.enabled.outputs.enabled == 'true'
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.enabled.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # makepkg refuses to run as root.
      - name: Publish both packages
        if: steps.enabled.outputs.enabled == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          useradd --create-home builder
          key=/home/builder/aur_key
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          chown builder "$key"
          chmod 600 "$key"
          cp -r . /home/builder/src
          chown -R builder /home/builder/src
          su builder -c "cd /home/builder/src && AUR_SSH_KEY_FILE=$key ./scripts/publish-aur.sh ${TAG#v}"
