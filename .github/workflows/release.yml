name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Unlike the implicit default, an explicit bash runs with -o pipefail.
defaults:
  run:
    shell: bash

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-versions.sh "$TAG"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write to the repository, and it runs no build.
    permissions:
      contents: write
    steps:
      # The tarball CI built and tested in this run, not a rebuild.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Checksum the .deb too
        working-directory: dist
        run: for deb in ./*.deb; do sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256"; done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # v1.2.0-rc.1 and the like are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ---- distribution channels ---------------------------------------------------
  #
  # Each channel needs an account and a secret; see "Distribution channels" in
  # the README. Until its secret exists a job skips itself with a notice, so a
  # release never fails for want of one.

  # The page and the apt repository are published together; see pages.yml.
  pages:
    name: Site and apt repository
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  copr:
    name: Fedora COPR
    needs: publish
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    # COPR builds from source and queues behind other projects.
    timeout-minutes: 120
    steps:
      - name: Check for COPR credentials
        id: enabled
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          # A repository variable is the natural home for a project name, but
          # it is easy to add as a secret instead; either works.
          COPR_PROJECT: ${{ vars.COPR_PROJECT || secrets.COPR_PROJECT }}
        run: |
          if [[ -n "$COPR_CONFIG" && -n "$COPR_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::COPR_CONFIG or COPR_PROJECT is not set, so no COPR build was started."
          fi
      - name: Install copr-cli
        if: steps.enabled.outputs.enabled == 'true'
        run: dnf install -y -q copr-cli
      # COPR clones the tag itself and runs .copr/Makefile, so the SRPM holds
      # exactly the tagged sources.
      - name: Build the tag in COPR
        if: steps.enabled.outputs.enabled == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || secrets.COPR_PROJECT }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          # copr-cli splits the project on "/", so a trailing slash would read
          # as an empty project name.
          copr-cli buildscm "${COPR_PROJECT%/}" --clone-url "$CLONE_URL" --commit "$TAG" \
            --method make_srpm --spec packaging/rpm/cosmic-tailscale.spec

  aur:
    name: AUR
    needs: publish
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Check for the AUR key
        id: enabled
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so nothing was published to the AUR."
          fi
      - name: Install tools
        if: steps.enabled.outputs.enabled == 'true'
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.enabled.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # makepkg refuses to run as root.
      - name: Publish both packages
        if: steps.enabled.outputs.enabled == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          useradd --create-home builder
          key=/home/builder/aur_key
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          chown builder "$key"
          chmod 600 "$key"
          cp -r . /home/builder/src
          chown -R builder /home/builder/src
          su builder -c "cd /home/builder/src && AUR_SSH_KEY_FILE=$key ./scripts/publish-aur.sh ${TAG#v}"
